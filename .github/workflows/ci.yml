name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BlazorQuizApp.sln
      - run: dotnet tool restore
      - run: dotnet build BlazorQuizApp.sln --configuration Release --no-restore
      - run: dotnet test BlazorQuizApp.Tests/BlazorQuizApp.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage"
      - run: dotnet list BlazorQuizApp.sln package --vulnerable --include-transitive
      - run: dotnet ef migrations script --idempotent --project BlazorQuizApp.csproj --startup-project BlazorQuizApp.csproj --no-build --configuration Release --output migration.sql
